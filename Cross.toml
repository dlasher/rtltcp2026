[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-linux-gnu:latest"
pre-build = [
    "apt-get update",
    "apt-get install -y librtlsdr-dev libsystemd-dev",
]

[target.i686-unknown-linux-gnu]
image = "ghcr.io/cross-rs/i686-linux-gnu:latest"
pre-build = [
    "apt-get update",
    "apt-get install -y librtlsdr-dev libsystemd-dev",
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-linux-gnueabihf:latest"
pre-build = [
    "apt-get update",
    "apt-get install -y librtlsdr-dev libsystemd-dev",
]
