name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt-get install -y librtlsdr-dev libsystemd-dev

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip binary and package
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          strip rtltcp
          RELEASE_NAME=rtltcp-${GITHUB_REF#refs/tags/}-linux-x86_64
          tar czvf "$RELEASE_NAME.tar.gz" rtltcp
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-gnu/release/rtltcp-*.tar.gz
            target/x86_64-unknown-linux-gnu/release/rtltcp-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publishing to Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_API_KEY }}
