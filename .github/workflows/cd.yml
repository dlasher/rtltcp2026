name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-rs
        run: |
          curl -fsSL https://astral.sh/cross/install | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Cross build for x86_64
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Strip binary and package (x86_64)
        shell: bash
        run: |
          strip target/x86_64-unknown-linux-gnu/release/rtltcp
          RELEASE_NAME=rtltcp-${GITHUB_REF#refs/tags/}-linux-x86_64
          tar czvf "$RELEASE_NAME.tar.gz" -C target/x86_64-unknown-linux-gnu/release rtltcp
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Cross build for aarch64
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Strip binary and package (aarch64)
        shell: bash
        run: |
          strip target/aarch64-unknown-linux-gnu/release/rtltcp
          RELEASE_NAME=rtltcp-${GITHUB_REF#refs/tags/}-linux-aarch64
          tar czvf "$RELEASE_NAME.tar.gz" -C target/aarch64-unknown-linux-gnu/release rtltcp
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Cross build for i686
        run: cross build --release --target i686-unknown-linux-gnu

      - name: Strip binary and package (i686)
        shell: bash
        run: |
          strip target/i686-unknown-linux-gnu/release/rtltcp
          RELEASE_NAME=rtltcp-${GITHUB_REF#refs/tags/}-linux-i686
          tar czvf "$RELEASE_NAME.tar.gz" -C target/i686-unknown-linux-gnu/release rtltcp
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Cross build for armv7
        run: cross build --release --target armv7-unknown-linux-gnueabihf

      - name: Strip binary and package (armv7)
        shell: bash
        run: |
          strip target/armv7-unknown-linux-gnueabihf/release/rtltcp
          RELEASE_NAME=rtltcp-${GITHUB_REF#refs/tags/}-linux-armv7
          tar czvf "$RELEASE_NAME.tar.gz" -C target/armv7-unknown-linux-gnueabihf/release rtltcp
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"

      - name: Debug - list files
        shell: bash
        run: |
          ls -la *.tar.gz *.sha256 2>/dev/null || echo "No matching files found"

      - name: Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF" --title "$GITHUB_REF" --notes "Release $(date)" --draft=false
          gh release upload "$GITHUB_REF" rtltcp-*.tar.gz rtltcp-*.sha256 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publishing to Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_API_KEY }}
